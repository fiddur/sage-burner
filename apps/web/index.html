<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sage Burner</title>
    <meta name="description" content="Membership and scheduling for a small co-created gathering." />

    <!--
      Installability (#256). The manifest is served by the backend rather than sitting
      here as a file, because it carries the installation's own name and its icon —
      both database rows an admin can change without a redeploy.

      These four paths are also in `apiRoutes`, which is where the backend registers
      them from. A `<link>` cannot import it, so `shell.test.ts` reads this file and
      asserts the two spellings still agree.

      `apple-touch-icon` points at the touch-icon route, not the icon route: iOS draws
      no SVG for a home-screen tile, so the icon route's SVG came out a gray square
      (#453). That route answers a PNG whatever is stored.

      The tab icon is declared here rather than only created by `favicon.ts`, so a
      signed-out visitor gets it too — that code runs from the notification bell,
      which only a signed-in member renders (#285). It carries no `type`, because the
      upload decides that and nothing here decodes an image to find out which it was.

      `id` is load-bearing: `favicon.ts` finds *this* element and rewrites its `href`.
      A second `rel="icon"` would leave it to the browser which one wins, which is
      how the first attempt at this came out doing nothing at all.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link id="app-favicon" rel="icon" href="/api/installation/icon" />
    <link rel="apple-touch-icon" sizes="180x180" href="/api/installation/icons/180" />
    <meta name="theme-color" content="#c2410c" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
