name: Build and Push Docker Image

on:
  # No `paths:` filter here, deliberately. A path-filtered `pull_request`
  # trigger reports *no check at all* on an unaffected PR rather than a passing
  # one — which a required status check waits on forever.
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

# A second push while the first is still building would otherwise race to move
# the `develop` tag, and the loser could win.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs rather than mutable major tags. The publish
# job holds DOCKERHUB_TOKEN — push rights on the image watchtower auto-deploys
# without review — so `@v3` meaning "whatever that tag points at today" is the
# same bet this repo declines elsewhere via pnpm's minimumReleaseAge and the
# watchtower version pin.

jobs:
  # Runs on pull requests and on push. On push it gates publishing: a merge to
  # develop is live on the server within five minutes, watchtower has no
  # rollback, and --cleanup removes the superseded image — so recovering from a
  # bad deploy means hand-pinning a <sha> tag in the compose file. On pull
  # requests it is the check the merge gate in AGENTS.md refers to.
  check:
    name: CI Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v6.0.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same gate as local development: formatting, types, lint, tests.
      - run: pnpm check
      - run: pnpm test

  # Runs on pull requests too, without pushing. Otherwise CI Gate could go green
  # on a change that breaks the image — a Dockerfile edit, a lockfile change, or
  # a new workspace package the runtime stage's hand-picked COPY list misses —
  # and the failure would surface only in the publish run after merge, leaving
  # develop unpublishable until someone noticed the red run.
  build:
    needs: check
    runs-on: ubuntu-latest
    # Nothing here uses GITHUB_TOKEN — Hub auth is via secrets and the GHA cache
    # uses ACTIONS_RUNTIME_TOKEN — so the default grant would be unused
    # privilege handed to four third-party actions on every run.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        # Nothing to authenticate for on a pull request, and this is the step
        # holding push rights on the deployed image.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: fiddur/sage-burner
          # `latest` is built from main rather than promoted from a sha-tagged
          # develop image: merging develop into main produces a new merge
          # commit, whose sha was never built, so there would be nothing to
          # retag. The GHA cache makes the rebuild cheap.
          tags: |
            type=sha,prefix=
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          # Build always, publish only from the two release branches. The branch
          # test also guards workflow_dispatch, which can be fired from any ref.
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' ||
            github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Surfaced by /api/version, so a deployed container can be traced
          # back to the commit it was built from.
          build-args: BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
