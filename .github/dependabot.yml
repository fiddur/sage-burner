version: 2

# The workflow pins actions to commit SHAs, which is the right call for a job
# holding push rights on an auto-deployed image — but a pin only stays a
# security measure if something keeps it current. Left alone it just rots, and
# the first set shipped two majors stale, which is the argument for automating
# rather than remembering.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'

  # Covers the Dockerfile only. Dependabot's `docker` fetcher takes
  # Dockerfiles plus YAML that looks like a Kubernetes resource (it requires
  # both `apiVersion` and `kind`), so a compose file is dropped before parsing
  # — see the separate `docker-compose` entry below.
  #
  # As written this entry has nothing to propose: the base image floats on a
  # tag rather than a digest, and majors are ignored just below. It is here for
  # the next image this repo pins.
  - package-ecosystem: docker
    directories:
      - /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deploy)'
    ignore:
      # Not major bumps of the base image. AGENTS.md records Node 24 LTS as a
      # deliberate divergence — odd-numbered lines never become LTS — so a
      # node:25 PR would arrive weekly and always be closed. It would fail
      # loudly rather than dangerously (root `engines: ~24` makes pnpm refuse
      # the install), but noise that is always wrong trains people to ignore
      # the rule that is sometimes right.
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # The compose file, and specifically the watchtower pin — the update in this
  # repo most worth seeing. That container holds the Docker socket read-write,
  # which is root-equivalent on the host, and upstream is dormant enough that a
  # move to a maintained fork may be the real answer.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deploy)'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    # Matches pnpm-workspace.yaml's minimumReleaseAge (4320 minutes = 72 hours).
    #
    # Grouping below bounds how *many* PRs arrive; this bounds *when*. Without
    # it, a weekly run landing inside that window proposes a version pnpm's
    # resolver refuses to consider, so `pnpm install --frozen-lockfile` fails
    # with ERR_PNPM_NO_MATCHING_VERSION and CI Gate goes red on a dependency
    # bump that was never installable. Same argument as the node-major ignore
    # above: a check that fails for reasons unrelated to the change teaches
    # people to skim past it.
    cooldown:
      default-days: 3
    # Keeps the 72-hour policy from becoming a stream of one-line PRs.
    groups:
      all-dependencies:
        patterns: ['*']
